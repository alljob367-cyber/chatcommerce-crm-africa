<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Audit Complet des Modules</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  body { margin: 0; }
  .gradient-number {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .ghost-8 {
    position: absolute;
    font-family: var(--font-mono);
    font-size: 320px;
    font-weight: 900;
    opacity: 0.03;
    color: var(--primary);
    top: 80px;
    right: 40px;
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div class="slide" style="display:flex;flex-direction:column;justify-content:space-between;">

  <!-- Top row: badges -->
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span class="badge badge-cyan">RAPPORT D'AUDIT</span>
    <span class="badge badge-blue">Aout 2026</span>
  </div>

  <!-- Ghost decorative 8 -->
  <div class="ghost-8" data-decor aria-hidden="true">8</div>

  <!-- Center: title + big number + subtitle -->
  <div style="position:relative;z-index:1;display:flex;align-items:center;gap:48px;flex:1;">
    <div style="flex:1;">
      <h1 style="font-family:var(--font-heading);font-size:var(--fs-display);font-weight:800;color:var(--text);line-height:1.15;margin-bottom:16px;">
        Audit Complet des Modules
      </h1>
      <p style="font-size:var(--fs-h3);color:var(--text-secondary);font-weight:400;max-width:520px;line-height:1.5;">
        ChatCommerce CRM Africa — Test Admin &amp; Rapport de Securite
      </p>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;min-width:220px;">
      <div class="gradient-number" style="font-family:var(--font-mono);font-size:120px;font-weight:900;line-height:1;">
        8
      </div>
    </div>
  </div>

  <!-- Bottom stats -->
  <div class="grid-4" style="margin-top:24px;">
    <div class="stat-card">
      <div style="font-family:var(--font-mono);font-size:36px;font-weight:700;color:var(--primary);line-height:1.2;">13</div>
      <div style="font-size:var(--fs-small);color:var(--text-secondary);margin-top:4px;">modules/API testes</div>
    </div>
    <div class="stat-card">
      <div style="font-family:var(--font-mono);font-size:36px;font-weight:700;color:var(--accent-red);line-height:1.2;">4</div>
      <div style="font-size:var(--fs-small);color:var(--text-secondary);margin-top:4px;">bugs critiques corriges</div>
    </div>
    <div class="stat-card">
      <div style="font-family:var(--font-mono);font-size:36px;font-weight:700;color:var(--accent-amber);line-height:1.2;">3</div>
      <div style="font-size:var(--fs-small);color:var(--text-secondary);margin-top:4px;">bugs moyens corriges</div>
    </div>
    <div class="stat-card">
      <div style="font-family:var(--font-mono);font-size:36px;font-weight:700;color:var(--accent-green);line-height:1.2;">100%</div>
      <div style="font-size:var(--fs-small);color:var(--text-secondary);margin-top:4px;">modules verifies</div>
    </div>
  </div>

  <!-- Logo link -->
  <div style="text-align:center;margin-top:20px;">
    <a href="https://chatcommerce.africa" style="color:var(--accent);font-size:var(--fs-small);text-decoration:none;font-weight:500;font-family:var(--font-mono);letter-spacing:0.02em;">
      chatcommerce.africa
    </a>
  </div>

  <span class="page-num">01</span>
</div>
</body>
</html>
